name: Auto-Release scholly-toolkit ZIP

# Sprint 291 CC-SKILL-CLOUD-AUTO-DEPLOY + CC-SKILL-CLOUD-CDN-CACHE-BUST
# Bei jedem Push zu main bauen wir scholly-toolkit.zip und legen sie an
# ZWEI Release-Tags an:
#   1. v-<short-sha>  — immutable per Commit, kein CDN-Cache-Problem
#   2. latest         — rolling Pointer auf neueste Version
# Cloud-Sessions nutzen idealerweise die immutable Variante (Bootstrap zieht
# aktuellen SHA via GitHub API + cachet selbst korrekt).

on:
  push:
    branches: [main]
    paths:
      - 'agents/**'
      - 'hooks/**'
      - 'scripts/**'
      - 'skills/**'
      - '.claude-plugin/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build scholly-toolkit.zip
        run: |
          set -euo pipefail
          zip -r scholly-toolkit.zip \
            agents/ hooks/ scripts/ skills/ .claude-plugin/ \
            -x '*.DS_Store' '*/__pycache__/*' '*.pyc'
          ls -la scholly-toolkit.zip
          unzip -l scholly-toolkit.zip | tail -5

      - name: Compute version-tag
        id: ver
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          echo "tag=v-$SHA_SHORT" >> "$GITHUB_OUTPUT"
          echo "sha_short=$SHA_SHORT" >> "$GITHUB_OUTPUT"

      - name: Create immutable per-commit release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          SHA="${{ steps.ver.outputs.sha_short }}"
          # Skip if release already exists (idempotent on re-runs)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping create"
          else
            gh release create "$TAG" scholly-toolkit.zip \
              --title "scholly-toolkit $TAG" \
              --notes "Immutable per-commit release. URL: https://github.com/escholly-ship-it/scholly-toolkit/releases/download/$TAG/scholly-toolkit.zip"
          fi

      - name: Update rolling latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          SHA="${{ steps.ver.outputs.sha_short }}"
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest scholly-toolkit.zip \
            --title "scholly-toolkit (latest: $SHA)" \
            --notes "Rolling Latest. Aktuell: $SHA. Immutable: $TAG. Nutzung: bootstrap zieht via GitHub-API die aktuelle Asset-URL, vermeidet CDN-Cache." \
            --latest
